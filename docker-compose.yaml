services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pcm
      POSTGRES_USER: pcm
      POSTGRES_PASSWORD: pcm_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcm -d pcm"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn website_pcm1.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      DEBUG: "False"
      SECRET_KEY: "docker-dev-secret-ganti-nanti"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web"  
      DATABASE_URL: "postgres://pcm:pcm_secret@db:5432/pcm"
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media: